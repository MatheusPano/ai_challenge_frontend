services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai_challenge_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Backend roda numa stack docker separada e publica a porta 4000 no host.
      # `host.docker.internal` resolve pro host na Docker Desktop (Mac/Win).
      BACKEND_URL: http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:
